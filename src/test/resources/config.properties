# Committed defaults. Override any key with -Dkey=value or an environment
# variable (UI_BASEURL, API_BASEURL, UI_HEADLESS, ...).

# Vite dev server (it proxies /api to the backend).
ui.baseUrl=http://localhost:5173
# Spring Boot backend, local profile.
api.baseUrl=http://localhost:8081

# chromium | chrome | edge | firefox | webkit
ui.browser=chromium
ui.headless=true
ui.slowMoMs=0
# Waits for elements and for Playwright assertions. Parallel runs against the
# Vite dev server are slow, so keep this high; a passing wait returns at once.
ui.timeoutMs=20000
ui.navigationTimeoutMs=30000
ui.viewport.width=1440
ui.viewport.height=900
# Record a Playwright trace; it is saved only for failed tests.
ui.trace=true

# Test data. Salon 2 "Omar Test Salon" belongs to the test owner; tests may change it.
# Salon 1 is a real salon: tests only read it.
data.salon.id=2
data.salon.employeeId=9014
data.otherSalon.id=1
